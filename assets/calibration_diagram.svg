<svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="480" fill="#0f172a" rx="14"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#f8fafc">Why Only One Direction Is Measured</text>
  <text x="40" y="66" font-size="12.5" fill="#94a3b8">Camera FOV creates a perspective "cone": equal real-world distances map to unequal pixel distances depending on depth</text>

  <!-- camera -->
  <polygon points="70,420 70,380 40,440 100,440" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="70" y="458" font-size="11" fill="#94a3b8" text-anchor="middle">street-level camera</text>

  <!-- FOV cone lines -->
  <path d="M70,400 L1000,120" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
  <path d="M70,400 L1000,420" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>

  <!-- road plane -->
  <path d="M70,400 L1030,300" stroke="#475569" stroke-width="2"/>

  <!-- near car with displacement -->
  <rect x="160" y="368" width="46" height="24" rx="4" fill="#16a34a" stroke="#22c55e"/>
  <rect x="260" y="360" width="46" height="24" rx="4" fill="#16a34a" stroke="#22c55e" opacity="0.55"/>
  <path d="M206,380 L260,372" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="220" y="410" font-size="11" fill="#86efac" text-anchor="middle">~100 px</text>
  <text x="220" y="424" font-size="10.5" fill="#64748b" text-anchor="middle">(close: same 5 m ≈ many px)</text>

  <!-- far car with displacement -->
  <rect x="740" y="270" width="26" height="14" rx="3" fill="#d97706" stroke="#f59e0b"/>
  <rect x="775" y="266" width="26" height="14" rx="3" fill="#d97706" stroke="#f59e0b" opacity="0.55"/>
  <path d="M766,277 L775,273" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="820" y="270" font-size="11" fill="#fcd34d" text-anchor="start">~18 px</text>
  <text x="820" y="285" font-size="10.5" fill="#64748b" text-anchor="start">(far: same 5 m ≈ few px)</text>

  <!-- calibration line callout -->
  <line x1="380" y1="330" x2="620" y2="308" stroke="#ef4444" stroke-width="3"/>
  <circle cx="380" cy="330" r="4" fill="#ef4444"/>
  <circle cx="620" cy="308" r="4" fill="#ef4444"/>
  <text x="500" y="296" font-size="11.5" fill="#fca5a5" text-anchor="middle" font-weight="600">calibration reference line</text>
  <text x="500" y="350" font-size="10.5" fill="#fca5a5" text-anchor="middle">22.5 m, measured by hand between bus-lane posts</text>

  <!-- right-side explanation box -->
  <rect x="700" y="360" width="360" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="720" y="384" font-size="12.5" font-weight="600" fill="#e2e8f0">Mitigation used in this project</text>
  <text x="720" y="405" font-size="11" fill="#94a3b8">Only vehicles moving left → right (same lane,</text>
  <text x="720" y="421" font-size="11" fill="#94a3b8">near the calibrated plane) are scored. Oncoming</text>
  <text x="720" y="437" font-size="11" fill="#94a3b8">traffic in the far lane is intentionally ignored to</text>
  <text x="720" y="453" font-size="11" fill="#94a3b8">reduce — not eliminate — this distance error.</text>

  <text x="40" y="475" font-size="10.5" fill="#64748b">No homography / perspective correction is applied — this is a known, documented limitation of the current approach.</text>
</svg>
